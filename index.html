<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café Loma · tarjeta-producto</title>
  <link rel="stylesheet" href="./estilos.css">

  <!-- PASO 1 · La página solo importa el módulo del componente.
       Ábrela con Live Server: los módulos no cargan con file:// -->
  <script type="module" src="./componentes/tarjeta-producto.js"></script>
</head>
<body>
  <!-- Cambia el título por el nombre de tu emprendimiento -->
  <h1>Café Loma</h1>

  <!-- PASO 4 · Usa la tarjeta tres veces con productos REALES de tu emprendimiento:
       cambia la foto, el nombre, la descripción y el precio de cada una. -->
  <main class="catalogo">

    <tarjeta-producto precio="2500">
      <img slot="foto" src="./img/cafe-espresso.jpg" alt="Taza de espresso clásico de Café Loma">
      <h3 slot="nombre">Espresso Clásico</h3>
      <p>Intenso y directo, tostado medio</p>
    </tarjeta-producto>

    <tarjeta-producto precio="3200">
      <img slot="foto" src="./img/cafe-capuchino.jpg" alt="Taza de capuchino vainilla de Café Loma">
      <h3 slot="nombre">Capuchino Vainilla</h3>
      <p>Leche cremosa con toque de vainilla</p>
    </tarjeta-producto>

    <tarjeta-producto precio="3800">
      <img slot="foto" src="./img/cafe-mocha.jpg" alt="Taza de mocha chocolate de Café Loma">
      <h3 slot="nombre">Mocha Chocolate</h3>
      <p>Espresso con cacao y leche</p>
    </tarjeta-producto>

  </main>
</body>
</html>
